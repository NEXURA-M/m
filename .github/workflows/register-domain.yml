name: Register Sitey Subdomain & Set Custom Domain

on:
  workflow_dispatch: # Aap isay manually "Run workflow" button se chala sakte hain
  push:
    branches: [ main ]

# Permissions ko theek kiya gaya hai taake repo mein changes push ho sakein
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  register-and-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Register Subdomain on Sitey
        run: |
          echo "Registering mtaqi-studio.sitey.my on Sitey..."
          curl -X POST https://sitey.my/mcp \
            -H "Content-Type: application/json" \
            -d '{
              "jsonrpc": "2.0",
              "method": "create_subdomain",
              "params": {
                "type": "CNAME",
                "value": "${{ github.repository_owner }}.github.io",
                "domain": "sitey.my",
                "subdomain": "mtaqi-studio"
              },
              "id": 1
            }'
          echo "Sitey registration request sent!"

      - name: Set Custom Domain using CNAME file
        run: |
          # CNAME file create kar rahe hain jise GitHub Pages khud read karta hai
          echo "mtaqi-studio.sitey.my" > CNAME
          
      - name: Commit and Push CNAME File
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CNAME
          # Agar file pehle se same hai toh error na aaye, isliye '|| echo' lagaya hai
          git commit -m "Auto-set Custom Domain to mtaqi-studio.sitey.my" || echo "No changes to commit"
          git push
